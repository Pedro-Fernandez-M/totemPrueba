<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" id="mapa" role="img" aria-label="Plano del predio del liceo">
  <defs>
    <pattern id="rows" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <rect width="16" height="16" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="16" stroke="rgba(122,190,150,.30)" stroke-width="3"/>
    </pattern>
    <pattern id="trees" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="5" fill="rgba(122,190,150,.34)"/>
      <circle cx="27" cy="27" r="5" fill="rgba(122,190,150,.34)"/>
    </pattern>
    <pattern id="grass" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="rgba(122,190,150,.13)" stroke-width="2"/>
    </pattern>
    <clipPath id="predio">
      <path d="M40 60 L960 40 L975 800 L860 872 L120 880 L30 700 Z"/>
    </clipPath>
  </defs>

  <!-- terreno -->
  <path d="M40 60 L960 40 L975 800 L860 872 L120 880 L30 700 Z" fill="#0E3A2C" stroke="rgba(242,246,236,.30)" stroke-width="2.5"/>
  <g clip-path="url(#predio)">
    <rect x="20" y="20" width="970" height="880" fill="url(#grass)" opacity=".7"/>

    <!-- potreros centrales -->
    <path d="M350 80 L500 76 L505 505 L345 508 Z" fill="rgba(122,190,150,.10)" stroke="rgba(242,246,236,.16)"/>
    <text class="map-label" x="358" y="112">Potreros</text>

    <!-- huerto de frutales -->
    <path d="M70 90 L320 82 L325 330 L72 335 Z" fill="url(#trees)" stroke="rgba(242,246,236,.18)"/>
    <text class="map-label" x="82" y="118">Frutales</text>

    <!-- invernaderos -->
    <g stroke="rgba(242,246,236,.35)" fill="rgba(90,169,204,.22)">
      <rect x="90" y="380" width="220" height="34" rx="17"/>
      <rect x="90" y="424" width="220" height="34" rx="17"/>
      <rect x="90" y="468" width="220" height="34" rx="17"/>
    </g>

    <!-- pivote central -->
    <circle cx="720" cy="290" r="200" fill="url(#rows)" stroke="rgba(242,246,236,.28)" stroke-width="2"/>
    <circle cx="720" cy="290" r="200" fill="rgba(90,169,204,.06)"/>
    <line x1="720" y1="290" x2="920" y2="290" stroke="rgba(242,246,236,.5)" stroke-width="4" stroke-dasharray="14 8"/>
    <circle cx="720" cy="290" r="9" fill="rgba(242,246,236,.6)"/>

    <!-- canal de riego -->
    <path d="M30 545 C 220 520, 430 560, 620 535 S 900 560, 975 545" fill="none" stroke="rgba(90,169,204,.65)" stroke-width="7" stroke-linecap="round"/>
    <text class="map-label" x="800" y="522">Canal Abranquil</text>

    <!-- casco de edificios -->
    <g fill="rgba(242,246,236,.16)" stroke="rgba(242,246,236,.45)" stroke-width="2">
      <rect x="95" y="600" width="180" height="82" rx="4"/>
      <rect x="95" y="712" width="180" height="70" rx="4"/>
      <rect x="300" y="600" width="120" height="70" rx="4"/>
      <rect x="300" y="700" width="150" height="88" rx="4"/>
      <rect x="490" y="608" width="150" height="76" rx="4"/>
      <rect x="490" y="716" width="185" height="90" rx="4"/>
      <rect x="512" y="560" width="86" height="46" rx="4"/>
    </g>

    <!-- media luna -->
    <circle cx="800" cy="720" r="72" fill="none" stroke="rgba(201,106,60,.85)" stroke-width="6"/>
    <circle cx="800" cy="720" r="52" fill="rgba(201,106,60,.14)"/>

    <!-- caminos -->
    <path d="M20 858 L980 838" stroke="rgba(242,246,236,.42)" stroke-width="14" fill="none"/>
    <path d="M20 858 L980 838" stroke="rgba(7,32,26,.9)" stroke-width="3" stroke-dasharray="20 18" fill="none"/>
    <path d="M175 858 L175 690" stroke="rgba(242,246,236,.3)" stroke-width="8" fill="none"/>
    <text class="map-label" x="600" y="884">Camino Abranquil km 1</text>
  </g>

  <!-- norte -->
  <g transform="translate(915,110)">
    <path d="M0 -34 L13 16 L0 6 L-13 16 Z" fill="rgba(242,246,236,.75)"/>
    <text class="map-label" x="0" y="42" text-anchor="middle" style="font-size:19px">N</text>
  </g>

  <!-- los puntos numerados se inyectan aqui desde contenido.json -->
  <g id="pins"></g>
</svg>
